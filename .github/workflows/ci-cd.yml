name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# necesario para poder publicar la imagen en ghcr.io con el token automatico
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Se omiten los tests por ahora: el contextLoads() por defecto necesita
      # una Oracle real, y todavia no montamos eso dentro del pipeline.
      - name: Compilar y empaquetar
        run: mvn -B clean package -DskipTests

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io exige el nombre en minusculas, pero github.repository trae
      # el usuario tal cual (RoxanaMorales) -> lo convertimos aqui antes de usarlo
      - name: Normalizar nombre de la imagen a minusculas
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
