# Conexion a Oracle.
# Si corres la app localmente (desde el IDE, sin Docker) y el contenedor "oracle"
# ya esta arriba con el puerto 1521 publicado, estos valores por defecto funcionan tal cual.
# Si corres la app DENTRO de docker-compose, el servicio "app" ya sobreescribe estas
# variables via environment (host "oracle" en vez de "localhost"), no tienes que tocar nada.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:telco_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:telco_pw123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# El esquema ya lo crea el script db-init/01_create_tables.sql la primera vez
# que arranca el contenedor de Oracle, asi que Hibernate NO debe tocar el esquema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Expone /actuator/health, lo vamos a usar mas adelante como probe de Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
